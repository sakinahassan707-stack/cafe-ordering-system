[tool.poetry]
name = "cafe-ordering-system"
version = "1.0.0"
description = "A command line till for a small drinks cafe"
authors = ["sakina <sakinahassan707@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10"
pyfiglet = "^1.0.2"

[tool.ruff]
select = ['E', 'W', 'F', 'I', 'B', 'C4', 'SIM']

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
